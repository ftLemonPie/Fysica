name: Ximera Workflow

on:
  push:
  workflow_dispatch:   # TEST 18/11/26: handmatig starten via Actions > Run workflow
    inputs:
      force:
        description: 'Alles opnieuw compileren (XM_FORCE)'
        type: boolean
        default: false
    # tags:
    #   - 'v*'  # Trigger the workflow when a new tag starting with 'v' is pushed   

jobs:
  build-ximera:
    name: Build and preview Ximera Courses
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full 

      - name: Setup cache
        uses: actions/cache@v4
        with:
          path: | 
            **/*.html
            **/*.pdf
            **/*.svg
            **/*.aux
            **/*.xref
            **/*.toc
            !xmPictures/**
            !.git/**
            !.github/**
          key: ximera-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ximera-${{ github.ref_name }}-
            ximera-


      # TEST 18/11/26: eerst een gewone build, zodat elk bestand een .aux heeft;
      # daarna alles geforceerd opnieuw (XM_FORCE), zodat \ref geen ?? meer geeft.
      # Terugdraaien: deze stap en de regel XM_FORCE hieronder verwijderen.
      - name: Pre-build (eerste compilatie voor .aux)
        env:
          XIMERA_URL: "https://xerxes.ximera.org/"
          XIMERA_NAME: "sui*preview"
        run: |
          chmod +x xmScripts/xmlatex
          ./xmScripts/xmlatex bake

      # TEST 18/11/26: pdf's waarvan de log om een tweede compilatie vraagt
      # (Rerun / undefined references) wissen, zodat de volgende stap ze opnieuw
      # compileert, nu met de .aux van de Pre-build.
      - name: Tweede compilatie voorbereiden (pdf's met ?? wissen)
        run: |
          grep -rlE --include='*.log' 'Rerun to get|undefined references|Label\(s\) may have changed' . | while read -r log; do
            stem="${log%.log}"
            echo "Opnieuw compileren: ${stem}.pdf"
            rm -f "${stem}.pdf"
          done || true

      # TEST 18/11/26: enkel bij handmatige run met 'force': alles opnieuw compileren.
      # XM_FORCE moet in config.txt staan: xmlatex geeft geen extra env-variabelen door aan docker.
      - name: Alles forceren (enkel handmatig)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: echo 'export XM_FORCE=1' >> xmScripts/config.txt

      - name: Build and publish Ximera courses
        env:
          # These variables can/should be set at repository level
          # If not set, defaults from xmScripts/config.txt or xlatex will be used 
          # (The defaults will presumably make this step fail.)
          GPG_KEY: ${{ secrets.GPG_KEY }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          XIMERA_URL: "https://xerxes.ximera.org/"
          XIMERA_NAME: "sui*preview"
        run: |
          ls -alrt
          chmod +x xmScripts/xmlatex   # Overleaf sync might reset it :-()
          ./xmScripts/xmlatex ghaction
          echo "✅ Published to $XIMERA_URL$XIMERA_NAME " >> $GITHUB_STEP_SUMMARY

      - name: Setup ximera serve cache (only .git)
        id: serve-cache
        uses: actions/cache/save@v4
        with:
          path: | 
            xmScripts/**
            .git/**
          key: ximeraSERVE-${{ github.ref_name }}-${{ github.sha }}


  publish-ximera:
    name: Publish Ximera Courses
    needs: build-ximera # Waits for the build job to complete
    runs-on: ubuntu-latest
    environment: production  # Allows for 'manual review' step
    steps:
      - name: Restore ximera serve cache (only .git)
        id: serve-cache-restore
        uses: actions/cache/restore@v4
        with:
          fail-on-cache-miss: true
          path: | 
            xmScripts/**
            .git/**
          key: ximeraSERVE-${{ github.ref_name }}-${{ github.sha }}
          
      - name: Serve
        env:
          GPG_KEY: ${{ secrets.GPG_KEY }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          XIMERA_URL: "https://xerxes.ximera.org/"
          XIMERA_NAME: "sui"
        run: |
          chmod +x xmScripts/xmlatex # Overleaf sync might reset it :-()
          ./xmScripts/xmlatex name         
          ./xmScripts/xmlatex serve -f  # NOTE: -f  should not be needed ...        
          echo "✅ Published to $XIMERA_URL$XIMERA_NAME " >> $GITHUB_STEP_SUMMARY



